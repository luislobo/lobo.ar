<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOBO.AR — 3D</title>
<meta name="description" content="LOBO.AR interactive 3D wolf">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#020711;--fg:#eef7ff;--muted:#7f95aa;--accent:#50bfff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 35%,#0d2940 0,#071522 30%,var(--bg) 70%);font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--fg);overflow:hidden}
main{height:100%;display:grid;grid-template-rows:1fr auto;position:relative}
model-viewer{width:100%;height:100%;min-height:0;--poster-color:transparent}
.brand{position:absolute;top:28px;left:50%;transform:translateX(-50%);font-size:clamp(28px,4vw,54px);font-weight:800;letter-spacing:.18em;white-space:nowrap;text-shadow:0 4px 30px #000}
.brand span{color:var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:0 16px 22px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
model-viewer.loaded+.loading{display:none}
</style>
</head>
<body>
<main>
  <div class="brand">LOBO<span>.AR</span></div>
  <model-viewer id="wolf" src="./assets/lobo-wolf.glb" alt="LOBO.AR 3D wolf"
    camera-controls auto-rotate rotation-per-second="10deg"
    shadow-intensity="1.2" shadow-softness=".8"
    exposure="1.1" environment-image="neutral"
    interaction-prompt="none" camera-orbit="0deg 78deg 105%"
    min-camera-orbit="auto auto 65%" max-camera-orbit="auto auto 180%">
  </model-viewer>
  <div class="loading">Loading 3D wolf…</div>
  <div class="hint">Drag to rotate · Scroll or pinch to zoom</div>
</main>
<script>
const m=document.querySelector('#wolf');
m.addEventListener('load',()=>m.classList.add('loaded'));
</script>
</body>
</html>
